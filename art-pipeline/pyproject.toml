[project]
name = "art-pipeline"
version = "0.1.0"
description = "WoadRaiders character pipeline: sketch -> rigged GLB as code (docs/character-pipeline.md)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "trimesh>=5.0.0",
    "websockets>=13",
]

[project.scripts]
art-pipeline = "art_pipeline.cli:main"

[tool.uv]
# Scoop's uv persist layer breaks managed-Python installs on this setup;
# the system CPython (pinned by .python-version) is the interpreter contract.
python-preference = "only-system"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art_pipeline"]
