# Torga — the non-chibi Knight replacement. First character through the pipeline.

[character]
name = "Torga"
# CharacterLoadout keeps meshes by prefix; Torga replaces the Knight class,
# so his meshes carry the Knight prefix (see CharacterView/CharacterLoadout).
mesh_prefix = "Knight"
attack_clip = "1H_Melee_Attack_Chop"
height_m = 1.85

[s1]
# PROVENANCE: the committed style_anchor.png was authored externally in nano
# banana (Gemini image) from the sketch — Paul's pick, 2026-07-31; the source
# render is nano_banana_ref_cel.png. His A-pose is rigger-friendly (MIA is
# pose-robust, AccuRIG prefers A-pose), so no T-pose normalization was needed.
# The recipe below is the LOCAL toolkit (Qwen) for variants and normalization
# — pose surgery, colorways, roster consistency — not the anchor's source.
sketch = "sketch.jpg"
# style_ref intentionally unset for the anchor: Qwen treats reference images
# as CONTENT, so a 3D-render ref drags the medium toward CGI (measured across
# batches 2-3). Chunky forms come from the prompt. The slot's future is
# cross-character consistency: once Torga's painted anchor is approved, it
# becomes the Rogue's style_ref — painted medium referencing painted medium.
seed = 1000        # candidates use seed, seed+1, ... (--seeds N)
lightning = true
steps = 8
cfg = 1.0
negative = ""      # inert at cfg 1; kept for non-lightning experiments
prompt = """Redraw the warrior from image 1 as a single polished \
hand-painted game character — a flat 2D painted illustration with visible \
matte gouache brushwork, soft blended strokes and painted highlights, \
never a 3D render. Build him from chunky simplified sculptural forms: big \
readable masses, bold clean silhouette, thick sturdy arms and legs, broad \
rounded armor plates, simplified planes with no fine surface noise — like \
a hand-painted RTS unit. Match the body pose exactly to the stick-figure \
skeleton in image 2: a strict T-pose, both arms straight out horizontally, \
elbows straight, palms down with fingers slightly spread, legs straight, \
feet apart with a clear gap between the boots, facing directly forward. \
Keep his identity from image 1: rounded conical helmet with a riveted brow \
band, angry face with bared gritted teeth, a heavy jaw and a thick brown \
mustache, riveted chainmail hauberk with chainmail sleeves and chainmail \
leggings, studded metal collar, crossed leather straps with a diamond \
emblem at the chest, wide leather belt with a large ornate scrolled \
buckle, red knee-length tabard and red under-skirt, heavy leather \
gauntlets and heavy brown boots. Empty hands, no \
weapons, no shield anywhere. Realistic heavyset proportions about 6.5 \
heads tall, NOT chibi. Muted worn steel greys, dark leather browns, \
off-white tabard cloth with woad-blue trim. Flat even shadowless lighting, \
no cast shadow on the ground, solid pure white background, full body head \
to toe, no text, no interface elements — ignore all the small UI boxes, \
icons and handwritten labels in image 1."""

[head]
# Kitbash stage: the head generated alone at full latent resolution, merged
# at the collar. Crop is (left, top, right, bottom) fractions of the anchor.
crop = [0.30, 0.04, 0.70, 0.40]
seed = 42
target_tris = 60000
body_cut = 0.82   # body keeps faces below this height fraction (collar top)
head_cut = 0.40   # head keeps faces above this fraction of its own height
shade_prompt = """Repaint this head as a softly shaded three-dimensional \
sculpture render. Keep every feature, proportion and color exactly the same: \
the riveted conical helmet with nasal bar, the angry eyes, the thick brown \
mustache, the bared gritted teeth, the studded metal collar and chainmail. \
Remove all black outlines and replace flat cel shading with smooth soft \
volumetric shading under gentle even studio light, like a painted 3D model \
render, so every surface reads as rounded three-dimensional form. Solid pure \
white background, no text."""

[reproject]
# Face band: mesh geometry (nose, snarl, brow) deviates from the flat drawing
# there, so projection smears — the generated texture keeps the face. Values
# are fractions of figure height (0 = soles, 1 = crown), feathered edges.
exclude_y = [[0.80, 0.94]]

[s2]
seed = 42
# Source-mesh budget, NOT the in-game budget. The 1536 latent carries fine
# geometry (mail bumps, folds, facial features) that low decimation discards;
# the game-ready decimation happens in the Blender stage (M3).
target_tris = 150000
mesh_resolution = "1536_cascade"  # 512 | 1024 | 1024_cascade | 1536_cascade; cascade = base + refine pass
texture_size = 4096
tex_steps = 32            # texture diffusion steps; node default 12 is the fast preset
tex_guidance = 1.0        # official pipeline value; the template's 3.0 over-drives the 1024-capped tex model
tex_guidance_rescale = 0.0
# The approved style anchor (M2 output), relative to this spec's folder.
# Until it exists, run with an explicit --image override.
style_anchor = "style_anchor.png"
